version: '3.8'

services:
  # Base de Datos PostgreSQL
  db:
    image: postgres:15.8-alpine
    container_name: boletin360-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-boletin360}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Backend (Node.js API)
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: boletin360-api
    restart: always
    environment:
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-boletin360}
      - JWT_SECRET=${JWT_SECRET:-secret_super_seguro_360}
      - PORT=3001
      - NODE_ENV=production
    volumes:
      - ./server/prisma:/app/prisma
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  # Frontend (Next.js)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boletin360-web
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=/api
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  # Proxy Reverso Nginx
  nginx:
    image: nginx:1.25-alpine
    container_name: boletin360-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
